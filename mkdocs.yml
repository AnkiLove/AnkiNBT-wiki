site_name: AnkiNBT 文档
site_description: AnkiNBT Minecraft NBT 编辑器文档
site_url: https://ankilove.github.io/AnkiNBT-wiki/
repo_url: https://github.com/AnkiLove/AnkiNBT
repo_name: AnkiLove/AnkiNBT
docs_dir: docs
site_dir: site
not_in_nav: |
  SUMMARY.md
  zh/SUMMARY.md
  zh/getting-started.md
  en/getting-started.md

theme:
  name: material
  language: zh
  logo: assets/blue-logo.png
  favicon: assets/blue-logo.png
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
  palette:
    - scheme: slate
      primary: cyan
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
    - scheme: default
      primary: cyan
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换到深色模式

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AnkiLove/AnkiNBT
      name: GitHub

plugins:
  - search:
      lang:
        - zh
        - en
  - i18n:
      docs_structure: folder
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
          site_name: AnkiNBT 文档
          site_description: AnkiNBT Minecraft NBT 编辑器文档
          nav:
            - 快速开始:
                - 快速开始: index.md
                - 安装指南: installation-guide.md
                - 快捷键: keyboard-shortcuts.md
                - 常见问题: faq.md
            - 编辑器指南:
                - 功能总览: feature-overview.md
                - 简易模式: simple-mode.md
                - 高级模式: advanced-mode.md
            - 兼容与发布:
                - 兼容矩阵: compat-matrix.md
                - 更新记录 2.0.0: changelog-2.0.0.md
                - 更新记录 1.2.4: changelog-1.2.4.md
                - 更新记录 1.2.0: changelog-1.2.0.md
                - 更新记录 1.1.0: changelog-1.1.0.md
            - 开发:
                - 编译说明: building.md
        - locale: en
          name: English
          build: true
          site_name: AnkiNBT Docs
          site_description: Documentation for the AnkiNBT Minecraft NBT editor
          theme:
            language: en
          nav:
            - Get Started:
                - Quick Start: index.md
                - Installation: installation-guide.md
                - Shortcuts: keyboard-shortcuts.md
                - FAQ: faq.md
            - Editor Guide:
                - Feature Overview: feature-overview.md
                - Simple Mode: simple-mode.md
                - Advanced Mode: advanced-mode.md
            - Compatibility & Releases:
                - Compatibility Matrix: compat-matrix.md
                - Changelog 2.0.0: changelog-2.0.0.md
                - Changelog 1.2.4: changelog-1.2.4.md
                - Changelog 1.2.0: changelog-1.2.0.md
                - Changelog 1.1.0: changelog-1.1.0.md
            - Development:
                - Build Notes: building.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - 快速开始:
      - 快速开始: index.md
      - 安装指南: installation-guide.md
      - 快捷键: keyboard-shortcuts.md
      - 常见问题: faq.md
  - 编辑器指南:
      - 功能总览: feature-overview.md
      - 简易模式: simple-mode.md
      - 高级模式: advanced-mode.md
  - 兼容与发布:
      - 兼容矩阵: compat-matrix.md
      - 更新记录 2.0.0: changelog-2.0.0.md
      - 更新记录 1.2.4: changelog-1.2.4.md
      - 更新记录 1.2.0: changelog-1.2.0.md
      - 更新记录 1.1.0: changelog-1.1.0.md
  - 开发:
      - 编译说明: building.md
